function list(){let q=$('search').value.toLocaleLowerCase();$('list').innerHTML=pool().filter(w=>(w.de+' '+w[lang]).toLocaleLowerCase().includes(q)).map(w=>`<div class="card"><div class="word">${esc(w.de)}</div><p class="muted">${esc(w[lang])}</p><button onclick="sound(${w.id})" aria-label="Ascultă ${esc(w.de)}">▶ Ascultă</button></div>`).join('')||'<p>Niciun rezultat.</p>'}

const grammar=[['A1 · Sein și haben','Cele două verbe de bază sunt neregulate.','ich bin · du bist · er/sie/es ist · wir sind · ihr seid · sie/Sie sind','ich habe · du hast · er/sie/es hat · wir haben · ihr habt · sie/Sie haben','Ich bin müde. — Sunt obosit. / I am tired. / Estoy cansado. / Sono stanco.'],['A1 · Articolele','Învață substantivul cu articol: der (masculin), die (feminin), das (neutru). Pluralul are articolul die.','der Mann → die Männer; die Frau → die Frauen; das Kind → die Kinder','ein Mann · eine Frau · ein Kind. La plural nu există articol nehotărât ein.','Das ist ein Haus. — Aceasta este o casă.'],['A1 · Ordinea cuvintelor','În propoziția enunțiativă verbul conjugat este pe poziția a doua. Poziție înseamnă constituent, nu al doilea cuvânt.','Ich lerne heute Deutsch. / Heute lerne ich Deutsch.','Întrebare da/nu: Lernst du Deutsch? Întrebare cu cuvânt interogativ: Wo wohnst du?','Wo wohnen Sie? — Unde locuiți?'],['A1 · Acuzativ','Obiectul direct apare frecvent în acuzativ. Articolul masculin se schimbă: der → den; ein → einen.','Ich sehe den Mann. Ich kaufe einen Apfel.','die și das nu se schimbă în acuzativ: Ich sehe die Frau / das Kind.','Ich hätte gern einen Kaffee. — Aș dori o cafea.'],['A1 · Negația','Kein neagă un substantiv cu articol nehotărât sau fără articol. Nicht neagă verbul, adjectivul sau alt element.','Ich habe kein Auto. / Das ist nicht teuer.','kein Mann · keine Frau · kein Kind; acuzativ masculin: keinen Mann','Ich verstehe nicht. — Nu înțeleg.'],['A1 · Verbe modale','Modalul este conjugat, iar verbul principal stă la infinitiv la final.','Ich kann Deutsch sprechen. / Du musst heute arbeiten.','können = a putea; müssen = a trebui; dürfen = a avea voie; wollen = a vrea; sollen = a trebui (recomandare/cerință)','Kannst du mir helfen? — Poți să mă ajuți?'],['A2 · Dativ','Dativul marchează adesea destinatarul. Articole: der/das → dem; die → der; plural → den.','Ich helfe dem Mann. / Ich gebe der Frau das Buch.','Prepoziții cu dativ: mit, nach, bei, seit, von, zu, aus.','Ich fahre mit dem Zug. — Merg cu trenul.'],['A2 · Perfekt','În conversație trecutul se exprimă frecvent cu haben/sein + participiu.','Ich habe Deutsch gelernt. / Ich bin nach Hause gegangen.','Multe verbe de mișcare cu schimbare de loc și de schimbare de stare folosesc sein. Participiile neregulate se învață individual.','Ich habe einen Kaffee getrunken. — Am băut o cafea.'],['A2 · Verbe separabile','Prefixul unui verb separabil merge la final în propoziția principală la prezent.','aufstehen → Ich stehe um sieben Uhr auf.','Cu modal: Ich muss früh aufstehen. La Perfekt: Ich bin früh aufgestanden.','einkaufen → Ich kaufe heute ein. — Fac cumpărături astăzi.'],['A2 · Weil și dass','În subordonatele introduse prin weil sau dass verbul conjugat stă la final.','Ich lerne Deutsch, weil ich in Deutschland wohne.','Ich glaube, dass er heute kommt. Nu uita virgula înaintea subordonatei.','weil = deoarece; dass = că.']];function lessons(){app.innerHTML='<h1>Înțelege regulile.</h1><p class="muted">10 lecții introductive A1–A2 · explicații în română. Nu reprezintă un curs CEFR complet.</p>'+grammar.map((g,i)=>`<details class="card"><summary>${esc(g[0])} ${state.lessons.includes(i)?'✓':''}</summary>${g.slice(1).map(x=>'<p>'+esc(x)+'</p>').join('')}<button onclick="completeLesson(${i})">Marchează parcursă ✓</button></details>`).join('')}function completeLesson(i){if(!state.lessons.includes(i)){state.lessons.push(i);award(20)}lessons()}
